// =================== STORAGE ===================
function loadState() {
  try { const p = localStorage.getItem('sehat_profile'); if (p) state.profile = { ...state.profile, ...JSON.parse(p) }; } catch(e) {}
  try { const l = localStorage.getItem('sehat_logs'); if (l) state.logs = JSON.parse(l); } catch(e) {}
}
function saveProfile() { try { localStorage.setItem('sehat_profile', JSON.stringify(state.profile)); } catch(e) {} }
function saveLogs() { try { localStorage.setItem('sehat_logs', JSON.stringify(state.logs)); } catch(e) {} }

// =================== HELPERS ===================
function today() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) {
  const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const dt = new Date(d);
  return `${days[dt.getDay()]}, ${dt.getDate()} ${months[dt.getMonth()]}`;
}
function calcBMI(w, h) { return w / Math.pow(h/100, 2); }
function bmiCategory(bmi) {
  if (bmi < 18.5) return { label: 'Kurus', color: 'text-sky-700', bg: 'bg-sky-100' };
  if (bmi < 25) return { label: 'Ideal', color: 'text-emerald-700', bg: 'bg-emerald-100' };
  if (bmi < 30) return { label: 'Berlebih', color: 'text-amber-700', bg: 'bg-amber-100' };
  if (bmi < 35) return { label: 'Obesitas I', color: 'text-orange-700', bg: 'bg-orange-100' };
  return { label: 'Obesitas II+', color: 'text-red-700', bg: 'bg-red-100' };
}
function calcBMR(w, h, age, gender) {
  return gender === 'pria' ? 10*w + 6.25*h - 5*age + 5 : 10*w + 6.25*h - 5*age - 161;
}
function calcStats() {
  const p = state.profile;
  const bmi = calcBMI(p.weight, p.height);
  const bmr = calcBMR(p.weight, p.height, p.age, p.gender);
  const tdee = bmr * p.activity;
  const targetCal = Math.round(tdee - 500);
  const idealWeight = Math.round(22 * Math.pow(p.height/100, 2) * 10) / 10;
  const toLose = Math.max(0, p.weight - p.targetWeight);
  const lostSoFar = Math.max(0, p.startWeight - p.weight);
  const totalToLose = p.startWeight - p.targetWeight;
  const progressPct = totalToLose > 0 ? Math.min(100, (lostSoFar/totalToLose)*100) : 0;
  const weeksToTarget = Math.ceil(toLose / 0.5);
  return { bmi, bmr: Math.round(bmr), tdee: Math.round(tdee), targetCal, idealWeight, toLose, lostSoFar, progressPct, weeksToTarget };
}
function getTodayLog() {
  return state.logs[today()] || { meals: [], exercises: [], water: 0 };
}
function updateTodayLog(fn) {
  const d = today();
  state.logs[d] = fn(state.logs[d] || { meals: [], exercises: [], water: 0 });
  saveLogs();
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// =================== RENDER ===================
function render() {
  const app = document.getElementById('app');
  const stats = calcStats();
  app.innerHTML = renderHeader() + renderTab(stats);
  document.querySelector('#tabbar > div').innerHTML = renderTabBar();
  if (state.tab === 'progress') setTimeout(renderChart, 50);
}

function renderHeader() {
  const p = state.profile;
  return `
    <header class="px-5 pt-7 pb-4">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-widest text-stone-500 font-medium">${fmtDate(today())}</p>
          <h1 class="font-display text-3xl font-semibold mt-1 leading-tight text-primary">Halo, ${escapeHtml(p.name)}</h1>
        </div>
        <div class="w-11 h-11 rounded-full bg-primary flex items-center justify-center text-white font-display text-lg">${escapeHtml(p.name[0] || 'U')}</div>
      </div>
    </header>`;
}

function renderTab(stats) {
  const wrap = (content) => `<main class="px-5 space-y-5">${content}</main>`;
  if (state.tab === 'beranda') return wrap(renderBeranda(stats));
  if (state.tab === 'profil') return wrap(renderProfil(stats));
  if (state.tab === 'diet') return wrap(renderDiet(stats));
  if (state.tab === 'olahraga') return wrap(renderOlahraga());
  if (state.tab === 'progress') return wrap(renderProgress(stats));
  return '';
}

function renderTabBar() {
  const tabs = [
    { id: 'beranda', label: 'Beranda', icon: I.home },
    { id: 'diet', label: 'Diet', icon: I.utensils },
    { id: 'olahraga', label: 'Olahraga', icon: I.dumbbell },
    { id: 'progress', label: 'Progres', icon: I.trending },
    { id: 'profil', label: 'Profil', icon: I.user },
  ];
  return tabs.map(t => `
    <button onclick="setTab('${t.id}')" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl scale-tap ${state.tab===t.id?'text-primary':'text-stone-400'}">
      ${t.icon}
      <span class="text-[10px] font-medium tracking-wide">${t.label}</span>
    </button>`).join('');
}

function renderBeranda(stats) {
  const log = getTodayLog();
  const cal = log.meals.reduce((s,m)=>s+m.cal,0);
  const protein = log.meals.reduce((s,m)=>s+m.p,0);
  const burned = log.exercises.filter(e=>e.done).reduce((s,e)=>s+e.cal,0);
  const cat = bmiCategory(stats.bmi);
  const calRem = stats.targetCal - cal;
  const pctCal = Math.min(100, (cal/stats.targetCal)*100);
  const tip = TIPS[new Date().getDate() % TIPS.length];

// =================== CHART ===================
let chartInstance = null;
function renderChart() {
  const canvas = document.getElementById('weight-chart');
  if (!canvas) return;
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  const entries = Object.entries(state.logs)
    .filter(([_, l]) => l.weight)
    .map(([date, l]) => ({ date, weight: l.weight }))
    .sort((a, b) => a.date.localeCompare(b.date));

  const seen = new Map();
  seen.set(state.profile.startDate, { date: state.profile.startDate, weight: state.profile.startWeight });
  entries.forEach(e => seen.set(e.date, e));
  const data = Array.from(seen.values()).sort((a,b) => a.date.localeCompare(b.date));

  if (data.length < 2) {
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#A8A29E';
    ctx.font = '13px Manrope';
    ctx.textAlign = 'center';
    ctx.fillText('Catat beratmu untuk melihat grafik', canvas.width/2, canvas.height/2);
    return;
  }

  const labels = data.map(d => fmtDate(d.date).split(', ')[1]);
  const values = data.map(d => d.weight);
  const target = state.profile.targetWeight;

  chartInstance = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Berat',
          data: values,
          borderColor: '#2D4A3E',
          backgroundColor: (ctx) => {
            const c = ctx.chart.ctx;
            const g = c.createLinearGradient(0, 0, 0, 220);
            g.addColorStop(0, 'rgba(45, 74, 62, 0.3)');
            g.addColorStop(1, 'rgba(45, 74, 62, 0)');
            return g;
          },
          borderWidth: 2.5,
          fill: true,
          tension: 0.3,
          pointRadius: 4,
          pointBackgroundColor: '#2D4A3E',
        },
        {
          label: 'Target',
          data: Array(values.length).fill(target),
          borderColor: '#C8633D',
          borderDash: [4, 4],
          borderWidth: 1.5,
          pointRadius: 0,
          fill: false,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'white',
          titleColor: '#1F1B16',
          bodyColor: '#1F1B16',
          borderColor: '#E7E2D6',
          borderWidth: 1,
          padding: 10,
          cornerRadius: 12,
          displayColors: false,
          callbacks: { label: (ctx) => `${ctx.parsed.y} kg` }
        }
      },
      scales: {
        x: { grid: { color: '#E7E2D6' }, ticks: { color: '#A8A29E', font: { size: 11 } } },
        y: { grid: { color: '#E7E2D6' }, ticks: { color: '#A8A29E', font: { size: 11 } }, suggestedMin: Math.min(...values, target) - 2, suggestedMax: Math.max(...values, target) + 2 }
      }
    }
  });
}

// =================== ACTIONS ===================
function setTab(tab) { state.tab = tab; state.openCat = null; render(); window.scrollTo(0,0); }
function setPhase(idx) { state.phaseIdx = idx; render(); }
function toggleCat(key) { state.openCat = state.openCat === key ? null : key; render(); }
function updateProfile(key, value) { state.profile[key] = value; saveProfile(); render(); }
function addMeal(catKey, itemIdx) {
  const item = FOOD_DB[catKey].items[itemIdx];
  updateTodayLog(log => ({ ...log, meals: [...log.meals, { ...item, cat: catKey, id: Date.now() + Math.random() }] }));
  state.openCat = null;
  render();
}
function removeMeal(id) {
  updateTodayLog(log => ({ ...log, meals: log.meals.filter(m => m.id !== id) }));
  render();
}
function toggleWater(delta) {
  updateTodayLog(log => ({ ...log, water: Math.max(0, Math.min(12, log.water + delta)) }));
  render();
}
function logWeight() {
  const input = document.getElementById('weight-input');
  const w = Number(input.value);
  if (!w || w < 30 || w > 300) { alert('Berat tidak valid (30–300 kg)'); return; }
  updateTodayLog(log => ({ ...log, weight: w }));
  state.profile.weight = w;
  saveProfile();
  render();
}
function toggleExercise(name, cal) {
  updateTodayLog(log => {
    const exists = log.exercises.find(e => e.name === name);
    if (exists) return { ...log, exercises: log.exercises.map(e => e.name === name ? { ...e, done: !e.done } : e) };
    return { ...log, exercises: [...log.exercises, { name, cal, done: true }] };
  });
  render();
}
function resetData() {
  if (!confirm('Yakin reset semua data? Tidak bisa dikembalikan.')) return;
  if (!confirm('Sekali lagi: SEMUA log makanan, olahraga, & berat akan terhapus. Lanjut?')) return;
  localStorage.removeItem('sehat_profile');
  localStorage.removeItem('sehat_logs');
  state.profile = { name: 'Leo', weight: 100, height: 173, age: 35, gender: 'pria', activity: 1.375, targetWeight: 70, startDate: today(), startWeight: 100 };
  state.logs = {};
  state.tab = 'beranda';
  render();
}

// =================== INIT ===================
loadState();
render();

// =================== PWA: Service Worker & Install ===================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed:', err));
  });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('sehat_install_dismissed')) {
    document.getElementById('install-banner').classList.remove('hidden');
  }
});

window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').classList.add('hidden');
  document.getElementById('ios-install-hint').classList.add('hidden');
  deferredPrompt = null;
});

function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById('install-banner').classList.add('hidden');
  });
}

function dismissInstall() {
  document.getElementById('install-banner').classList.add('hidden');
  document.getElementById('ios-install-hint').classList.add('hidden');
  localStorage.setItem('sehat_install_dismissed', '1');
}

// iOS install hint (Safari doesn't fire beforeinstallprompt)
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
if (isIOS && !isStandalone && !localStorage.getItem('sehat_install_dismissed')) {
  setTimeout(() => {
    document.getElementById('ios-install-hint').classList.remove('hidden');
  }, 2000);
}
</script>
